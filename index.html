<!DOCTYPE html>
<html>
	<head>
		<title>Louie is the Best Dog!!!</title>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				background: #f6f1e8;
				color: #1f1a17;
				font-family: Georgia, "Times New Roman", serif;
			}

			.page {
				box-sizing: border-box;
				display: flex;
				align-items: center;
				justify-content: center;
				height: 100vh;
				padding: 16px;
			}

			figure {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				width: 100%;
				height: 100%;
				margin: 0;
			}

			.image-frame {
				display: flex;
				align-items: center;
				justify-content: center;
				flex: 1 1 auto;
				min-height: 0;
				width: 100%;
			}

			img {
				max-width: 100%;
				max-height: 100%;
				width: 100%;
				height: 100%;
				object-fit: contain;
			}

			figcaption {
				flex: 0 0 auto;
				text-align: center;
				font-size: clamp(1.2rem, 2vw, 2rem);
				line-height: 1.2;
			}
		</style>
	</head>
	<body>
		<main class="page">
			<figure>
				<div class="image-frame">
					<img src="louie.jpg" alt="Louie" />
				</div>
				<figcaption>Louie is the best dog --- Chris.</figcaption>
			</figure>
		</main>
	</body>
</html>
